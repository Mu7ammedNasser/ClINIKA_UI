<div class="dashboard-page">
  
  <div class="page-header">
    <div>
      <h1 class="page-title">Admin Dashboard</h1>
      <p class="page-subtitle">Overview of your system metrics and status.</p>
    </div>
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <span class="spinner"></span>
      <p>Loading metrics...</p>
    </div>
  } @else {
    <div class="metrics-grid">
      
      <!-- Total Users Card -->
      <div class="metric-card">
        <div class="metric-icon-wrapper bg-blue-50 text-blue-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3 class="metric-label">Total Users</h3>
          <p class="metric-value">{{ totalUsers() }}</p>
        </div>
      </div>

      <!-- Active Users Card -->
      <div class="metric-card">
        <div class="metric-icon-wrapper bg-emerald-50 text-emerald-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3 class="metric-label">Active Users</h3>
          <p class="metric-value">{{ activeUsers() }}</p>
        </div>
      </div>

      <!-- Total Roles Card -->
      <div class="metric-card">
        <div class="metric-icon-wrapper bg-purple-50 text-purple-600">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
          </svg>
        </div>
        <div class="metric-info">
          <h3 class="metric-label">System Roles</h3>
          <p class="metric-value">{{ totalRoles() }}</p>
        </div>
      </div>

      <!-- System Status Card -->
      <div class="metric-card">
        <div class="metric-icon-wrapper bg-[var(--color-ice)] text-[var(--color-ocean)]">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="metric-info">
          <h3 class="metric-label">System Status</h3>
          <p class="metric-value text-emerald-500 text-xl flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span> Online
          </p>
        </div>
      </div>

    </div>
  }
</div>
